<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>学校活动布告板</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/display.css">
<script>
  // 先定好昼夜模式再画第一帧，避免闪一下错误配色
  (function () {
    try {
      var s = localStorage.getItem("rb_theme");
      document.documentElement.dataset.theme =
        s === "light" || s === "dark" ? s
        : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  })();
</script>
</head>
<body class="display-body">

<!-- 校园公告：横贯屏幕最上面一条 -->
<div class="banner-box">
  <div class="banner-head">
    <span data-i18n="announcements">校园公告</span>
  </div>
  <div class="marquee" id="marquee">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>
  <span class="banner-hint" id="bannerHint"></span>
</div>

<header class="topbar">
  <div class="wolf-wrap" id="wolf"></div>
  <div class="topbar-title">
    <h1 id="schoolName">学校活动布告板</h1>
    <div class="topbar-clock">
      <span id="clockDate">—</span>
      <span id="clockTime" class="clock-time">--:--</span>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="view-switch" id="viewSwitch">
      <button class="seg-btn" data-mode="day" data-i18n="day_view">日</button>
      <button class="seg-btn" data-mode="week" data-i18n="week_view">周</button>
      <button class="seg-btn active" data-mode="month" data-i18n="month_view">月</button>
      <button class="seg-btn" data-mode="academic" data-i18n="academic_view">学年</button>
    </div>
    <button class="ghost icon-btn" id="sideToggle">
      <svg viewBox="0 0 24 24" class="icon-panel" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
        <path d="M14.5 4.5v15"></path>
      </svg>
    </button>
    <button class="ghost icon-btn" id="themeBtn">
      <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"></path>
      </svg>
      <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.4 14.5A8.5 8.5 0 1 1 9.5 3.6a6.7 6.7 0 0 0 10.9 10.9z"></path>
      </svg>
    </button>
    <button class="ghost" id="langBtn">EN</button>
  </div>
</header>

<main class="layout">
  <!-- 左：日历 -->
  <section class="calendar-pane">
    <div class="cal-header">
      <button id="prevBtn" class="ghost nav-btn">上一月</button>
      <h2 id="calTitle">—</h2>
      <button id="nextBtn" class="ghost nav-btn">下一月</button>
      <button id="todayBtn" class="ghost" data-i18n="today_btn">回到今天</button>
    </div>
    <div class="cal-weekdays" id="weekdays"></div>
    <div class="upcoming hidden" id="upcoming">
      <span class="upcoming-label" data-i18n="upcoming">即将到来</span>
      <div class="upcoming-track" id="upcomingTrack"></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend"></div>
  </section>

  <!-- 右：AI（可以折叠） -->
  <aside class="side-pane">
    <div class="ai-box" id="aiBox">
      <div class="ai-head">
        <span data-i18n="ai_title">小狼 AI 助手</span>
        <span class="ai-status" id="aiStatus"></span>
        <button class="icon-btn ai-toggle" id="aiToggle">
          <svg viewBox="0 0 24 24" class="icon-chevron" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9.5l6 6 6-6"></path>
          </svg>
        </button>
      </div>
      <div class="ai-log" id="aiLog"></div>
      <div class="ai-quick" id="aiQuick"></div>
      <form class="ai-input" id="aiForm">
        <input id="aiInput" data-i18n-ph="ai_placeholder" placeholder="问我任何问题…" autocomplete="off">
        <button type="submit" class="primary" data-i18n="ai_send">发送</button>
      </form>
    </div>
  </aside>
</main>

<!-- 日详情面板 -->
<div class="day-panel" id="dayPanel">
  <div class="day-panel-head">
    <h3 id="dayPanelTitle">—</h3>
    <button class="ghost" id="dayClose" data-i18n="close">关闭</button>
  </div>
  <div class="day-panel-body" id="dayPanelBody"></div>
  <div class="day-panel-foot">
    <button id="askAboutDay" class="ghost" data-i18n="ask_event_hint">让小狼介绍这一天的安排</button>
  </div>
</div>
<div class="day-panel-scrim" id="dayScrim"></div>

<!-- 公告详情 -->
<div class="overlay hidden" id="postOverlay">
  <div class="card">
    <header>
      <h3 id="postTitle">—</h3>
      <div class="spacer"></div>
      <button class="ghost" id="postClose" data-i18n="close">关闭</button>
    </header>
    <div class="body" id="postBody"></div>
  </div>
</div>

<div id="toast"></div>
<script type="module" src="/js/display.js"></script>
</body>
</html>
